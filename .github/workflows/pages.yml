# Publishes the suite to GitHub Pages.
#
# There is no build step — index.html and assets/ are the site — so this just
# uploads the repository root as the Pages artifact.
#
# Pages itself has to be switched on once by hand: a workflow's GITHUB_TOKEN can
# deploy to an existing Pages site but cannot create one (POST /repos/.../pages
# returns "Resource not accessible by integration"), so `enablement: true` is
# deliberately not used here — it can only fail. Turn Pages on once at
# Settings -> Pages -> Source: GitHub Actions, and every push deploys from then on.

name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch. Update this if the branch is renamed.
    branches: [claude/nice-shannon-dzc785]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
